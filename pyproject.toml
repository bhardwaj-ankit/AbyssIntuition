[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liquidity-signal-engine"
version = "0.1.0"
description = "Binance liquidity-based long/short confidence with TP/SL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "httpx>=0.27.0",
  "websockets>=16.0",
  "pydantic>=2.8.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
]
ml = [
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "scikit-learn>=1.4.0",
  "joblib>=1.4.0",
  "pyarrow>=16.0.0",
  "duckdb>=1.0.0",
]
train = [
  "torch>=2.3.0",
  "transformers>=4.44.0",
  "datasets>=2.21.0",
  "peft>=0.12.0",
  "accelerate>=0.33.0",
]
mlx = [
  "mlx-lm[train]>=0.21.0",
]

[project.scripts]
liquidity-signal = "liquidity_signal.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
