services:
  app:
    build:
      context: .
    container_name: abyssintuition-api
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - ./runtime:/app/runtime
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - abyss_net

  caddy:
    image: caddy:2.10-alpine
    container_name: abyssintuition-caddy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - .env.docker
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - abyss_net

volumes:
  caddy_data:
  caddy_config:

networks:
  abyss_net:
    driver: bridge
