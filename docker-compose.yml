services:
  app:
    build:
      context: .
    container_name: abyssintuition-api
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - ./runtime:/app/runtime
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - abyss_net

  caddy:
    image: caddy:2.10-alpine
    container_name: abyssintuition-caddy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - .env.docker
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - abyss_net

  collector:
    profiles: ["data-collection"]
    build:
      context: .
    container_name: abyssintuition-liquidation-collector
    restart: unless-stopped
    command:
      - liquidity-signal
      - capture-liquidations
      - --db-path
      - runtime/liquidation_history.db
      - --status-interval-seconds
      - "30"
    volumes:
      - ./runtime:/app/runtime
    stop_grace_period: 30s
    networks:
      - abyss_net

  daily-refresh:
    profiles: ["data-collection"]
    build:
      context: .
    container_name: abyssintuition-daily-data-refresh
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          liquidity-signal daily-data-refresh --retry-days 3 --forward-lookback-hours 36 --no-run-training-when-ready
          liquidity-signal backup-data
          liquidity-signal data-operations-health --no-fail-on-unhealthy
          sleep "$${DAILY_REFRESH_INTERVAL_SECONDS:-86400}"
        done
    environment:
      DAILY_REFRESH_INTERVAL_SECONDS: "86400"
    volumes:
      - ./runtime:/app/runtime
    networks:
      - abyss_net

volumes:
  caddy_data:
  caddy_config:

networks:
  abyss_net:
    driver: bridge
